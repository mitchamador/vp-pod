name: PlatformIO ESP32 Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [pioarduino, bt-codecs]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-${{ matrix.environment }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.environment }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio==6.1.19

      - name: Build Firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Archive Build Files
        run: |
          mkdir -p release_archives
          TARGET_DIR=".pio/build/${{ matrix.environment }}"
          cd "$TARGET_DIR"
          zip "../../../release_archives/${{ matrix.environment }}.zip" firmware.bin bootloader.bin partitions.bin
          cd ../../..

      - name: Upload temporary archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.environment }}
          path: release_archives/${{ matrix.environment }}.zip

  create-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: all_archives
          pattern: archive-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_archives/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board_build.partitions = huge_app.csv
framework = arduino
extra_scripts = pre:version.py
build_flags = 
	-D PIOENV="\"$PIOENV"\"
	; -D STACK_HIGH_WATERMARK_LOG
lib_deps = 
	https://github.com/pschatzmann/ESP32-A2DP.git@^1.8.10
	https://github.com/pschatzmann/arduino-audio-tools.git@^1.2.5
	https://github.com/pschatzmann/arduino-audio-driver.git@^0.3.0
	rpolitex/ArduinoNvs@^2.10
monitor_filters = esp32_exception_decoder
monitor_speed = 115200

[env:vp]
build_flags = 
   ${env.build_flags}
	-D VPPOD
   -D CORE_DEBUG_LEVEL=3
	-D RESET_STATE_KEY=0
	; -D AUTOPLAY_AFTER_CONNECT
	-D ENABLE_ACTIVE_DCD
	-D IPOD_SERIAL_BAUDRATE=57600
	-D RX_TASK_INTERVAL_MS=5
	-D PROCESS_INTERVAL_MS=7
	-D TX_INTERVAL_MS=10
	-D TIMER_INTERVAL_MS=2
	-D NO_RESET_ON_SERIAL_TIMEOUT
#	-D USE_ESP_IDF_SERIAL
#	-D USE_ESP_IDF_TIME
#	-D TRACK_CHANGE_CALLBACK
board = nodemcu-32s
lib_ignore = audio-driver


; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env]
extra_scripts = pre:version.py
build_flags = 
	-D PIOENV="\"$PIOENV"\"
	; -D STACK_HIGH_WATERMARK_LOG
monitor_filters = esp32_exception_decoder
monitor_speed = 115200

[env:pioarduino]
board_build.partitions = huge_app.csv
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
lib_deps = 
	https://github.com/pschatzmann/ESP32-A2DP.git@^1.8.10
	https://github.com/pschatzmann/arduino-audio-tools.git@^1.2.5
	https://github.com/pschatzmann/arduino-audio-driver.git@^0.3.0
	rpolitex/ArduinoNvs@^2.10
build_flags = 
	-I include/api
    ${env.build_flags}
	-D VPPOD
   -D CORE_DEBUG_LEVEL=3
	-D RESET_STATE_KEY=0
	-D ENABLE_ACTIVE_DCD
	-D IPOD_SERIAL_BAUDRATE=57600
	-D RX_TASK_INTERVAL_MS=5
	-D PROCESS_INTERVAL_MS=7
	-D TX_INTERVAL_MS=10
	-D TIMER_INTERVAL_MS=2
	-D NO_RESET_ON_SERIAL_TIMEOUT
board = nodemcu-32s
lib_ignore = audio-driver

[env:bt-codecs]
framework = espidf
platform = espressif32
platform_packages =
   framework-espidf @ https://github.com/mitchamador/ESP32-A2DP-SINK-WITH-CODECS-UPDATED/releases/download/v5.5.2.260206.1-bt-codecs/esp-idf-v5.5.2.260206-bt-codecs.tar.xz	
build_flags =
	-Wno-shift-negative-value
	-Wno-type-limits
	-Wno-unused-variable
	-Wno-deprecated-declarations
	-Wno-format
	-Wno-empty-body
	-Wno-unused-but-set-variable
	-Wno-missing-field-initializers
	-Wno-unused-function
	${env.build_flags}
	-D VPPOD
	-D CORE_DEBUG_LEVEL=3
	-D RESET_STATE_KEY=0
	-D ENABLE_ACTIVE_DCD
	-D IPOD_SERIAL_BAUDRATE=57600
	-D RX_TASK_INTERVAL_MS=5
	-D PROCESS_INTERVAL_MS=7
	-D TX_INTERVAL_MS=10
	-D TIMER_INTERVAL_MS=2
	-D NO_RESET_ON_SERIAL_TIMEOUT
board = nodemcu-32s
